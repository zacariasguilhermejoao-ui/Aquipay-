name: Deploy Aquipay site to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bundle native security and push plugins
        run: npx --yes esbuild@0.25.0 site/native-push-entry.js --bundle --platform=browser --format=iife --outfile=site/native-push.bundle.js
        # Native contacts plugin is bundled separately for the Android WebView.

      - name: Bundle Google Play Billing for Android WebView
        run: npx --yes esbuild@0.25.0 site/js/purchases.js --bundle --platform=browser --format=esm --target=es2020 --outfile=site/js/purchases.bundle.js

      - name: Deploy static assets
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN não está configurado nos secrets do GitHub."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
