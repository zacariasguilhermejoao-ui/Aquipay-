name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bundle Capacitor native push plugin
        run: npx --yes esbuild@0.25.0 site/native-push-entry.js --bundle --platform=browser --format=iife --outfile=site/native-push.bundle.js

      - name: Validate JavaScript syntax
        run: |
          node --check site/app.js
          node --input-type=module --check < backend/src/index.js

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android platform (if missing)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew não existe. A preparar uma plataforma Android limpa..."
            mkdir -p "$RUNNER_TEMP/aquipay-android-backup"
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp "android/app/src/main/AndroidManifest.xml" "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml"
            fi
            rm -rf android
            npx cap add android
            if [ -f "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" ]; then
              cp "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"
            fi
          else
            echo "android/gradlew já existe."
          fi
          test -f android/gradlew

      - name: Install native Android Share Target receiver
        run: |
          mkdir -p android/app/src/main/java/com/aquipay/isabstudio
          cat > android/app/src/main/java/com/aquipay/isabstudio/MainActivity.java <<'JAVA'
          package com.aquipay.isabstudio;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.PluginHandle;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ShareReceiverPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  dispatchSharedIntent(intent);
              }

              private void dispatchSharedIntent(Intent intent) {
                  if (intent == null || getBridge() == null) return;
                  PluginHandle handle = getBridge().getPlugin("ShareReceiver");
                  if (handle != null && handle.getInstance() instanceof ShareReceiverPlugin) {
                      ((ShareReceiverPlugin) handle.getInstance()).handleShareIntent(intent);
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/aquipay/isabstudio/ShareReceiverPlugin.java <<'JAVA'
          package com.aquipay.isabstudio;

          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.OpenableColumns;
          import android.webkit.MimeTypeMap;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.FileOutputStream;
          import java.util.LinkedHashSet;
          import java.util.UUID;

          @CapacitorPlugin(name = "ShareReceiver")
          public class ShareReceiverPlugin extends Plugin {
              private JSObject pendingShare;

              @PluginMethod
              public void getPendingShare(PluginCall call) {
                  JSObject result = pendingShare;
                  pendingShare = null;
                  call.resolve(result == null ? new JSObject() : result);
              }

              public void handleShareIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;

                  JSObject payload = new JSObject();
                  String subject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                  CharSequence sharedText = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
                  payload.put("title", subject == null ? "" : subject);
                  payload.put("text", sharedText == null ? "" : sharedText.toString());
                  payload.put("url", "");
                  JSArray files = new JSArray();
                  LinkedHashSet<Uri> uris = new LinkedHashSet<>();

                  ClipData clip = intent.getClipData();
                  if (clip != null) {
                      for (int i = 0; i < clip.getItemCount(); i++) {
                          Uri uri = clip.getItemAt(i).getUri();
                          if (uri != null) uris.add(uri);
                      }
                  }

                  if (Intent.ACTION_SEND.equals(action)) {
                      Uri stream = getSingleStream(intent);
                      if (stream != null) uris.add(stream);
                  } else {
                      for (Uri uri : getMultipleStreams(intent)) if (uri != null) uris.add(uri);
                  }

                  for (Uri uri : uris) {
                      JSObject file = copyImageToCache(uri);
                      if (file != null) files.put(file);
                      if (files.length() >= 4) break;
                  }

                  payload.put("files", files);
                  if (payload.optString("text").isEmpty() && payload.optString("title").isEmpty() && files.length() == 0) return;
                  pendingShare = payload;
                  notifyListeners("shareReceived", payload, true);
              }

              private Uri getSingleStream(Intent intent) {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) return intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri.class);
                      return (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  } catch (Exception ignored) { return null; }
              }

              @SuppressWarnings("deprecation")
              private java.util.ArrayList<Uri> getMultipleStreams(Intent intent) {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) return intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM, Uri.class);
                      return intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                  } catch (Exception ignored) { return new java.util.ArrayList<>(); }
              }

              private JSObject copyImageToCache(Uri uri) {
                  ContentResolver resolver = getContext().getContentResolver();
                  String mime = resolver.getType(uri);
                  if (mime == null || !mime.startsWith("image/")) return null;
                  String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                  if (ext == null || ext.isEmpty()) ext = "img";
                  File folder = new File(getContext().getCacheDir(), "shared-images");
                  if (!folder.exists() && !folder.mkdirs()) return null;
                  File target = new File(folder, UUID.randomUUID().toString() + "." + ext);
                  long total = 0;
                  try (InputStream input = resolver.openInputStream(uri);
                       OutputStream output = new FileOutputStream(target)) {
                      if (input == null) return null;
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) {
                          total += count;
                          if (total > 50L * 1024L * 1024L) {
                              target.delete();
                              return null;
                          }
                          output.write(buffer, 0, count);
                      }
                      JSObject file = new JSObject();
                      file.put("path", target.getAbsolutePath());
                      file.put("mimeType", mime);
                      return file;
                  } catch (Exception ignored) {
                      target.delete();
                      return null;
                  }
              }
          }
          JAVA
          test -s android/app/src/main/java/com/aquipay/isabstudio/MainActivity.java
          test -s android/app/src/main/java/com/aquipay/isabstudio/ShareReceiverPlugin.java

      - name: Configure Firebase Cloud Messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Gradle files not found after Capacitor Android setup")

          root_text = root.read_text()
          dependency = "classpath 'com.google.gms:google-services:4.4.2'"
          if dependency not in root_text:
              if "dependencies {" in root_text:
                  root_text = root_text.replace("dependencies {", "dependencies {\n        " + dependency, 1)
              else:
                  root_text = "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { " + dependency + " }\n}\n" + root_text
              root.write_text(root_text)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(app_text)
          PY


      - name: Generate Android app icon and splash resources
        run: |
          python -m pip install --quiet Pillow
          mkdir -p assets/android-generated
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          out = Path("assets/android-generated")
          splash_bg = (0, 0, 0, 255)

          # Reuse the existing AquiPay artwork; only resize/pad it for Android's
          # required source dimensions. No new logo artwork is created.
          icon = Image.open("assets/icon/aquipay-icon.png").convert("RGBA")
          icon = ImageOps.fit(icon, (1024, 1024), method=Image.Resampling.LANCZOS)
          icon.save(out / "icon-only.png")
          icon.save(out / "icon-foreground.png")

          Image.new("RGBA", (1024, 1024), (124, 58, 237, 255)).save(out / "icon-background.png")

          source = Image.open("assets/splash/aquipay-splash.png").convert("RGBA")
          source.thumbnail((2732, 2732), Image.Resampling.LANCZOS)
          for name in ("splash.png", "splash-dark.png"):
              canvas = Image.new("RGBA", (2732, 2732), splash_bg)
              canvas.alpha_composite(source, ((2732 - source.width) // 2, (2732 - source.height) // 2))
              canvas.save(out / name)
          PY
          npx --yes @capacitor/assets generate --android --assetPath assets/android-generated --iconBackgroundColor '#7c3aed' --splashBackgroundColor '#000000'

      - name: Generate square legacy launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("assets/icon/aquipay-icon.png").convert("RGBA")
          densities = {
              "mipmap-ldpi": 36,
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              target = Path("android/app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher_legacy.png")
          PY

      - name: Configure Android launch themes
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="splash_background">#000000</color>
          </resources>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#7c3aed</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="@style/AppTheme">
                  <item name="android:windowBackground">@drawable/splash</item>
              </style>
          </resources>
          EOF
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="@style/AppTheme">
                  <item name="android:windowBackground">@color/splash_background</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#000000</item>
              </style>
          </resources>
          EOF
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable-port-xxxhdpi/splash.png

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Configure and validate release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          mkdir -p android
          # Remove only accidental CR/LF wrapping from Base64. Passwords are never trimmed or rewritten.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/release.keystore
          if [[ ! -s android/release.keystore ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          chmod 600 android/release.keystore

          # Validate store password first, then alias; never print secret values.
          if ! keytool -list -keystore android/release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore file or ANDROID_KEYSTORE_PASSWORD is invalid. Recheck those two secrets."
            exit 1
          fi
          if ! keytool -list -keystore android/release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS does not match an entry in this keystore. Recheck that secret."
            exit 1
          fi
          echo "Keystore, store password, and alias validated."

          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          if not gradle.is_file():
              raise SystemExit("::error::android/app/build.gradle was not generated.")

          source = gradle.read_text(encoding="utf-8")
          # Repair accidental literal backslash-n sequences from generated content.
          source = source.replace("\\n", "\n")

          marker = "// AquiPay CI release signing"
          if marker not in source:
              source = source.rstrip() + """

          // AquiPay CI release signing
          android {
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          if "\\n" in source:
              raise SystemExit("::error::Literal backslash-n remains in android/app/build.gradle")
          gradle.write_text(source.rstrip() + "\n", encoding="utf-8", newline="\n")
          print("Gradle release signing configuration prepared.")
          PY

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build APK + AAB (release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          jarsigner -verify app/build/outputs/apk/release/*.apk
          jarsigner -verify app/build/outputs/bundle/release/*.aab

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AAB (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore
