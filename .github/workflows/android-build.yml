name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bundle Capacitor native plugins
        run: |
          npx --yes esbuild@0.25.0 site/native-push-entry.js --bundle --platform=browser --format=iife --outfile=site/native-push.bundle.js
          npx --yes esbuild@0.25.0 site/native-contacts-entry.js --bundle --platform=browser --format=iife --outfile=site/native-contacts.bundle.js
          npx --yes esbuild@0.25.0 site/native-google-entry.js --bundle --platform=browser --format=iife --outfile=site/native-google.bundle.js

      - name: Validate JavaScript syntax
        run: |
          node --check site/app.js
          node --input-type=module --check < backend/src/index.js

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Add Android platform (if missing)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew não existe. A preparar uma plataforma Android limpa..."
            mkdir -p "$RUNNER_TEMP/aquipay-android-backup"
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp "android/app/src/main/AndroidManifest.xml" "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml"
            fi
            rm -rf android
            npx cap add android
            if [ -f "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" ]; then
              cp "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"
            fi
          else
            echo "android/gradlew já existe."
          fi
          test -f android/gradlew

      - name: Install native Android Share Target receiver
        run: |
          mkdir -p android/app/src/main/java/com/aquipay/isabstudio
          cat > android/app/src/main/java/com/aquipay/isabstudio/MainActivity.java <<'JAVA'
          package com.aquipay.isabstudio;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.PluginHandle;
          import com.getcapacitor.Plugin;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ShareReceiverPlugin.class);
                  super.onCreate(savedInstanceState);
                  dispatchAppLink(getIntent());
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().evaluateJavascript(
                          "window.dispatchEvent(new Event('aquipay:backbutton'));", null
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle handle = getBridge().getPlugin("SocialLogin");
                      if (handle != null && handle.getInstance() instanceof SocialLoginPlugin) {
                          ((SocialLoginPlugin) handle.getInstance()).handleGoogleLoginIntent(requestCode, data);
                      }
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  dispatchSharedIntent(intent);
                  dispatchAppLink(intent);
              }

              private void dispatchAppLink(Intent intent) {
                  if (intent == null || !Intent.ACTION_VIEW.equals(intent.getAction()) || getBridge() == null) return;
                  android.net.Uri uri = intent.getData();
                  if (uri == null || !"https".equals(uri.getScheme()) || !"aquipay.isabstudio.dev".equals(uri.getHost())) return;
                  String script = "window.dispatchEvent(new CustomEvent('aquipay:deeplink',{detail:{url:" + org.json.JSONObject.quote(uri.toString()) + "}}));";
                  getBridge().getWebView().postDelayed(() -> getBridge().getWebView().evaluateJavascript(script, null), 900);
              }

              private void dispatchSharedIntent(Intent intent) {
                  if (intent == null || getBridge() == null) return;
                  PluginHandle handle = getBridge().getPlugin("ShareReceiver");
                  if (handle != null && handle.getInstance() instanceof ShareReceiverPlugin) {
                      ((ShareReceiverPlugin) handle.getInstance()).handleShareIntent(intent);
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/aquipay/isabstudio/ShareReceiverPlugin.java <<'JAVA'
          package com.aquipay.isabstudio;

          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.OpenableColumns;
          import android.webkit.MimeTypeMap;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.FileOutputStream;
          import java.util.LinkedHashSet;
          import java.util.UUID;

          @CapacitorPlugin(name = "ShareReceiver")
          public class ShareReceiverPlugin extends Plugin {
              private JSObject pendingShare;

              @PluginMethod
              public void getPendingShare(PluginCall call) {
                  JSObject result = pendingShare;
                  pendingShare = null;
                  call.resolve(result == null ? new JSObject() : result);
              }

              public void handleShareIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;

                  JSObject payload = new JSObject();
                  String subject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                  CharSequence sharedText = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
                  payload.put("title", subject == null ? "" : subject);
                  payload.put("text", sharedText == null ? "" : sharedText.toString());
                  payload.put("url", "");
                  JSArray files = new JSArray();
                  LinkedHashSet<Uri> uris = new LinkedHashSet<>();

                  ClipData clip = intent.getClipData();
                  if (clip != null) {
                      for (int i = 0; i < clip.getItemCount(); i++) {
                          Uri uri = clip.getItemAt(i).getUri();
                          if (uri != null) uris.add(uri);
                      }
                  }

                  if (Intent.ACTION_SEND.equals(action)) {
                      Uri stream = getSingleStream(intent);
                      if (stream != null) uris.add(stream);
                  } else {
                      for (Uri uri : getMultipleStreams(intent)) if (uri != null) uris.add(uri);
                  }

                  for (Uri uri : uris) {
                      JSObject file = copyImageToCache(uri);
                      if (file != null) files.put(file);
                      if (files.length() >= 4) break;
                  }

                  payload.put("files", files);
                  if (payload.optString("text").isEmpty() && payload.optString("title").isEmpty() && files.length() == 0) return;
                  pendingShare = payload;
                  notifyListeners("shareReceived", payload);
              }

              private Uri getSingleStream(Intent intent) {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) return intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri.class);
                      return (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  } catch (Exception ignored) { return null; }
              }

              @SuppressWarnings("deprecation")
              private java.util.ArrayList<Uri> getMultipleStreams(Intent intent) {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) return intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM, Uri.class);
                      return intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                  } catch (Exception ignored) { return new java.util.ArrayList<>(); }
              }

              private JSObject copyImageToCache(Uri uri) {
                  ContentResolver resolver = getContext().getContentResolver();
                  String mime = resolver.getType(uri);
                  if (mime == null || !mime.startsWith("image/")) return null;
                  String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                  if (ext == null || ext.isEmpty()) ext = "img";
                  File folder = new File(getContext().getCacheDir(), "shared-images");
                  if (!folder.exists() && !folder.mkdirs()) return null;
                  File target = new File(folder, UUID.randomUUID().toString() + "." + ext);
                  long total = 0;
                  try (InputStream input = resolver.openInputStream(uri);
                       OutputStream output = new FileOutputStream(target)) {
                      if (input == null) return null;
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) {
                          total += count;
                          if (total > 50L * 1024L * 1024L) {
                              target.delete();
                              return null;
                          }
                          output.write(buffer, 0, count);
                      }
                      JSObject file = new JSObject();
                      file.put("path", target.getAbsolutePath());
                      file.put("mimeType", mime);
                      return file;
                  } catch (Exception ignored) {
                      target.delete();
                      return null;
                  }
              }
          }
          JAVA
          test -s android/app/src/main/java/com/aquipay/isabstudio/MainActivity.java
          test -s android/app/src/main/java/com/aquipay/isabstudio/ShareReceiverPlugin.java

      - name: Configure Firebase Cloud Messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Gradle files not found after Capacitor Android setup")

          root_text = root.read_text()
          dependency = "classpath 'com.google.gms:google-services:4.4.2'"
          if dependency not in root_text:
              if "dependencies {" in root_text:
                  root_text = root_text.replace("dependencies {", "dependencies {\n        " + dependency, 1)
              else:
                  root_text = "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { " + dependency + " }\n}\n" + root_text
              root.write_text(root_text)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(app_text)
          PY


      - name: Generate Android app icon and splash resources
        run: |
          python -m pip install --quiet Pillow
          mkdir -p assets/android-generated
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          out = Path("assets/android-generated")
          splash_bg = (0, 0, 0, 255)

          # Reuse the existing AquiPay artwork; only resize/pad it for Android's
          # required source dimensions. No new logo artwork is created.
          icon = Image.open("assets/icon/aquipay-icon.png").convert("RGBA")
          icon = ImageOps.fit(icon, (1024, 1024), method=Image.Resampling.LANCZOS)
          icon.save(out / "icon-only.png")
          icon.save(out / "icon-foreground.png")

          Image.new("RGBA", (1024, 1024), (124, 58, 237, 255)).save(out / "icon-background.png")

          source = Image.open("assets/splash/aquipay-splash.png").convert("RGBA")
          source.thumbnail((2732, 2732), Image.Resampling.LANCZOS)
          for name in ("splash.png", "splash-dark.png"):
              canvas = Image.new("RGBA", (2732, 2732), splash_bg)
              canvas.alpha_composite(source, ((2732 - source.width) // 2, (2732 - source.height) // 2))
              canvas.save(out / name)
          PY
          npx --yes @capacitor/assets generate --android --assetPath assets/android-generated --iconBackgroundColor '#7c3aed' --splashBackgroundColor '#000000'

      - name: Generate square legacy launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("assets/icon/aquipay-icon.png").convert("RGBA")
          densities = {
              "mipmap-ldpi": 36,
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              target = Path("android/app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher_legacy.png")
          PY

      - name: Configure Android launch themes
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="splash_background">#000000</color>
          </resources>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#7c3aed</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="@style/AppTheme">
                  <item name="android:windowBackground">@drawable/splash</item>
              </style>
          </resources>
          EOF
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="@style/AppTheme">
                  <item name="android:windowBackground">@color/splash_background</item>
                  <item name="android:windowSplashScreenBackground">@color/splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#000000</item>
              </style>
          </resources>
          EOF
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable-port-xxxhdpi/splash.png

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android SDK levels (min 24, target 36)
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          variables = root / "variables.gradle"
          app_gradle = root / "app/build.gradle"
          root_gradle = root / "build.gradle"
          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"

          if not variables.is_file() or not app_gradle.is_file() or not root_gradle.is_file():
              raise SystemExit("Expected generated Capacitor Android Gradle files were not found.")

          source = variables.read_text(encoding="utf-8")
          for key, value in (("minSdkVersion", 24), ("compileSdkVersion", 36), ("targetSdkVersion", 36)):
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*(?://.*)?)$"
              source, count = re.subn(pattern, rf"\g<1>{value}\g<2>", source)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} assignment in android/variables.gradle; found {count}.")
          variables.write_text(source, encoding="utf-8")

          # Android Gradle Plugin 8.9.1 supports API 36; Gradle 8.11.1 is its minimum.
          root_source = root_gradle.read_text(encoding="utf-8")
          root_source, agp_count = re.subn(
              r"com\.android\.tools\.build:gradle:[0-9.]+",
              "com.android.tools.build:gradle:8.9.1",
              root_source,
              count=1,
          )
          if agp_count != 1:
              raise SystemExit("Could not locate the Android Gradle Plugin dependency to upgrade to 8.9.1.")
          root_gradle.write_text(root_source, encoding="utf-8")

          if wrapper.is_file():
              wrapper_source = wrapper.read_text(encoding="utf-8")
              wrapper_source, wrapper_count = re.subn(
                  r"(?m)^distributionUrl=.*gradle-[0-9.]+-(?:all|bin)\.zip$",
                  "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip",
                  wrapper_source,
                  count=1,
              )
              if wrapper_count != 1:
                  raise SystemExit("Could not update Gradle wrapper to 8.11.1.")
              wrapper.write_text(wrapper_source, encoding="utf-8")

          print("Configured minSdkVersion=24, compileSdkVersion=36, targetSdkVersion=36, Android Gradle Plugin 8.9.1 and Gradle 8.11.1.")
          PY

      - name: Resolve AndroidX Browser dependency conflict
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/build.gradle")
          if not gradle.is_file():
              raise SystemExit("android/build.gradle was not generated")
          source = gradle.read_text(encoding="utf-8")
          rule = """// AquiPay: align AndroidX Browser for native Google Credential Manager
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force 'androidx.browser:browser:1.8.0'
              }
          }
          """
          if "AquiPay: align AndroidX Browser" not in source:
              source = source.rstrip() + "\n\n" + rule
              gradle.write_text(source, encoding="utf-8")
          print("AndroidX Browser pinned to 1.8.0, compatible with compileSdk 35 and AGP 8.7.2.")
          PY

      - name: Configure encrypted storage backup exclusions
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/backup_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="sharedpref" path="cap_sec.xml" />
          </full-backup-content>
          XML
          cat > android/app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="cap_sec.xml" />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="sharedpref" path="cap_sec.xml" />
              </device-transfer>
          </data-extraction-rules>
          XML

      - name: Use direct Gradle distribution mirror
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#; s/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
            grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Report Android debug signing SHA-1
        working-directory: android
        run: ./gradlew signingReport --console=plain | grep -E 'Variant:|SHA1:'

      - name: Configure and validate release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          mkdir -p android
          # Remove only accidental CR/LF wrapping from Base64. Passwords are never trimmed or rewritten.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/release.keystore
          if [[ ! -s android/release.keystore ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          chmod 600 android/release.keystore

          # Diagnose the keystore without ever printing secret values.
          echo "Decoded keystore size: $(stat -c '%s' android/release.keystore) bytes"
          echo "Keystore file identification:"
          file android/release.keystore || true

          # Accept either configured password in the store-password slot. This
          # safely handles the common case where the two GitHub secrets were swapped.
          if keytool -list -keystore android/release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              >"$RUNNER_TEMP/keystore-check.log" 2>&1; then
            EFFECTIVE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            echo "Keystore opened with ANDROID_KEYSTORE_PASSWORD."
          elif keytool -list -keystore android/release.keystore \
              -storepass "$ANDROID_KEY_PASSWORD" \
              >"$RUNNER_TEMP/keystore-check-key-password.log" 2>&1; then
            EFFECTIVE_STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
            echo "::warning::Keystore opened with ANDROID_KEY_PASSWORD. The two password secrets appear to be swapped; using the working value for storePassword."
          else
            echo "::error::Neither configured password can open the decoded keystore. Safe diagnostic:"
            cat "$RUNNER_TEMP/keystore-check.log"
            echo "The alternate password was also rejected. Confirm the original keystore file and its store password; do not create a new signing key for an existing app."
            exit 1
          fi

          if ! keytool -list -keystore android/release.keystore \
              -storepass "$EFFECTIVE_STORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              >"$RUNNER_TEMP/keystore-alias-check.log" 2>&1; then
            echo "::error::Keystore opened, but ANDROID_KEY_ALIAS was not found. Safe keytool diagnostic follows:"
            cat "$RUNNER_TEMP/keystore-alias-check.log"
            exit 1
          fi

          # Make the validated store password available to the release Gradle step
          # without exposing it in logs.
          printf 'AQUIPAY_EFFECTIVE_STORE_PASSWORD=%s\n' "$EFFECTIVE_STORE_PASSWORD" >> "$GITHUB_ENV"

          echo "Release keystore SHA-1 fingerprint (safe to share with Google Cloud):"
          keytool -list -v -keystore android/release.keystore -storepass "$EFFECTIVE_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -iE 'SHA1:|SHA-1:|SHA256:|SHA-256:'

          echo "Keystore, store password, alias, and private-key password validated."

          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          if not gradle.is_file():
              raise SystemExit("::error::android/app/build.gradle was not generated.")

          source = gradle.read_text(encoding="utf-8")
          # Repair accidental literal backslash-n sequences from generated content.
          source = source.replace("\\n", "\n")

          marker = "// AquiPay CI release signing"
          if marker not in source:
              source = source.rstrip() + """

          // AquiPay CI release signing
          android {
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword System.getenv("AQUIPAY_EFFECTIVE_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          if "\\n" in source:
              raise SystemExit("::error::Literal backslash-n remains in android/app/build.gradle")
          gradle.write_text(source.rstrip() + "\n", encoding="utf-8", newline="\n")
          print("Gradle release signing configuration prepared.")
          PY

      - name: Build APK + AAB (release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          jarsigner -verify app/build/outputs/apk/release/*.apk
          jarsigner -verify app/build/outputs/bundle/release/*.aab

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AAB (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore
