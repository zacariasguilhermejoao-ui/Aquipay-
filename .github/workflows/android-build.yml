name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android platform (if missing)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew não existe. A preparar uma plataforma Android limpa..."
            mkdir -p "$RUNNER_TEMP/aquipay-android-backup"
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp "android/app/src/main/AndroidManifest.xml" "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml"
            fi
            rm -rf android
            npx cap add android
            if [ -f "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" ]; then
              cp "$RUNNER_TEMP/aquipay-android-backup/AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"
            fi
          else
            echo "android/gradlew já existe."
          fi
          test -f android/gradlew

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build AAB + APK (release)
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AAB (release)
        uses: actions/upload-artifact@v4
        with:
          name: aquipay-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore
