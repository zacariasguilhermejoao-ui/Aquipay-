name: Deploy AquiPay API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/wrangler.jsonc"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy AquiPay API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config backend/wrangler.jsonc
